# PostgREST para block_mishi (stage) — primera instancia del estándar nuevo.
# Pieza de plataforma mke (destino final: mke/platform/postgrest/, generado por
# verbo mke; hoy aplicado a mano en el milestone 1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: block-mishi-pgrst
  namespace: stage
  labels:
    app: block-mishi-pgrst
    app.kubernetes.io/part-of: mke-postgrest
spec:
  replicas: 1
  selector:
    matchLabels: { app: block-mishi-pgrst }
  template:
    metadata:
      labels: { app: block-mishi-pgrst }
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.12
          ports: [{ containerPort: 3000 }]
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef: { name: block-mishi-pgrst, key: PGRST_DB_URI }
            - name: PGRST_DB_SCHEMAS
              value: "public"
            # todo request corre como el rol web; RLS por sub del JWT hace el
            # resto. Sin claim `role` en el JWT del IdP, PostgREST se queda en
            # el anon-role — que ES el rol web (la puerta de sesión vive en la
            # ForwardAuth + la firma se valida acá igual).
            - name: PGRST_DB_ANON_ROLE
              value: "block_mishi_web"
            # JWKS de AMBOS emisores (stage y prod): la cookie mishi_sesion es
            # de dominio compartido y puede venir firmada por cualquiera.
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: block-mishi-pgrst, key: PGRST_JWT_SECRET }
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
          readinessProbe:
            httpGet: { path: /ready, port: 3001 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /live, port: 3001 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: block-mishi-pgrst
  namespace: stage
  labels:
    app.kubernetes.io/part-of: mke-postgrest
spec:
  selector: { app: block-mishi-pgrst }
  ports: [{ port: 3000, targetPort: 3000 }]
