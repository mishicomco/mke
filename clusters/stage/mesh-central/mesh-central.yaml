---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: mesh-central
    app.kubernetes.io/part-of: mke
  name: mesh-central
  namespace: mesh-central
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-central
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mesh-central
    spec:
      containers:
      - env:
        - name: HOSTNAME
          value: mesh-stage.mishi.com.co
        - name: USE_MONGODB
          value: 'false'
        image: ghcr.io/ylianst/meshcentral:1.2.1
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 20
          tcpSocket:
            port: 443
        name: mesh-central
        ports:
        - containerPort: 443
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: 443
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /opt/meshcentral/meshcentral-data
          name: data
        - mountPath: /opt/meshcentral/meshcentral-files
          name: files
      initContainers:
      - command:
        - sh
        - -c
        - "set -e\nCFG=/data/config.json\nif [ -f \"$CFG\" ]; then echo \"config.json\
          \ ya existe, no se toca\"; exit 0; fi\nKEY=\"${SESSION_KEY:-$(head -c32\
          \ /dev/urandom | od -An -tx1 | tr -d ' \\n')}\"\ncat > \"$CFG\" <<EOF\n\
          {\n  \"settings\": {\n    \"cert\": \"${HOSTNAME}\",\n    \"TlsOffload\"\
          : true,\n    \"port\": 443,\n    \"aliasPort\": 443,\n    \"redirPort\"\
          : 80,\n    \"sessionKey\": \"${KEY}\",\n    \"WebRTC\": ${WEBRTC},\n   \
          \ \"SelfUpdate\": false,\n    \"AgentPong\": 300\n  },\n  \"domains\": {\n\
          \    \"\": {\n      \"certUrl\": \"https://${HOSTNAME}\",\n      \"NewAccounts\"\
          : ${ALLOW_NEW_ACCOUNTS}\n    }\n  }\n}\nEOF\necho \"config.json generado\
          \ para ${HOSTNAME}\"\n"
        env:
        - name: HOSTNAME
          value: mesh-stage.mishi.com.co
        - name: ALLOW_NEW_ACCOUNTS
          value: 'true'
        - name: WEBRTC
          value: 'true'
        - name: SESSION_KEY
          valueFrom:
            secretKeyRef:
              key: session-key
              name: mesh-central-secrets
              optional: true
        image: busybox:1.36
        name: init-config
        volumeMounts:
        - mountPath: /data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mesh-central-data
      - name: files
        persistentVolumeClaim:
          claimName: mesh-central-files

---
apiVersion: v1
kind: Service
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: mesh-central
    app.kubernetes.io/part-of: mke
  name: mesh-central
  namespace: mesh-central
spec:
  ports:
  - name: http
    port: 80
    targetPort: 443
  selector:
    app: mesh-central

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: mesh-central-mesh-central-headers@kubernetescrd
  labels:
    app.kubernetes.io/name: mesh-central
    app.kubernetes.io/part-of: mke
  name: mesh-central
  namespace: mesh-central
spec:
  ingressClassName: traefik
  rules:
  - host: mesh-stage.mishi.com.co
    http:
      paths:
      - backend:
          service:
            name: mesh-central
            port:
              number: 80
        path: /
        pathType: Prefix

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: mesh-central
    app.kubernetes.io/part-of: mke
  name: mesh-central-headers
  namespace: mesh-central
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Port: '443'
      X-Forwarded-Proto: https

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: mesh-central
    app.kubernetes.io/part-of: mke
  name: mesh-central-data
  namespace: mesh-central
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/name: mesh-central
    app.kubernetes.io/part-of: mke
  name: mesh-central-files
  namespace: mesh-central
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

